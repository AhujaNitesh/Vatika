<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose New Password — Vatika Virtual Herbal Garden</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <!-- Dedicated Authentication Page Stylesheet -->
  <link rel="stylesheet" href="css/signin.css">
  <script src="js/auth.js" defer></script>
</head>
<body class="signin-page-body">

  <!-- PRESERVED SITE NAVIGATION -->
  <header class="navbar-wrapper">
    <div class="navbar-full" id="main-navbar">
      <div class="nav-brand-container">
        <a href="index.html" class="nav-brand" aria-label="Vatika Homepage">
          <div class="brand-logo-wrap">
            <svg class="vitaki-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect width="48" height="48" rx="14" fill="#14532d" />
              <path d="M13 14L24 34L35 14" stroke="#6EE7B7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="24" cy="19" r="2.5" fill="#FFFFFF"/>
            </svg>
          </div>
          <div class="brand-text-block">
            <span class="brand-title">Vatika</span>
            <span class="brand-tagline">Herbal Sanctuary</span>
          </div>
        </a>
      </div>

      <div class="nav-right-action">
        <a href="signin.html" class="btn-nav-start">
          <span>← Back to Sign In</span>
        </a>
      </div>
    </div>
  </header>

  <!-- Ambient Background -->
  <div class="signin-ambient-backdrop">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
  </div>

  <div class="signin-container">
    <div class="signin-card">
      
      <div style="display: flex; justify-content: center; margin-bottom: 0.2rem;">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(52, 211, 153, 0.15); border: 1.5px solid var(--color-mint); display: grid; place-items: center; font-size: 24px;">
          🔑
        </div>
      </div>

      <div class="signin-brand-header">
        <h1 class="signin-title">Choose New Password</h1>
        <p class="signin-subtitle">Please enter a secure new password for your account below.</p>
      </div>

      <div id="auth-alert-box"></div>

      <form class="signin-form" id="new-password-form">
        <div class="form-group-botanical">
          <label for="new-password">New Password</label>
          <div class="input-icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="new-password" class="input-botanical" placeholder="At least 6 characters" minlength="6" required>
          </div>
        </div>

        <div class="form-group-botanical">
          <label for="confirm-password">Confirm New Password</label>
          <div class="input-icon-wrap">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirm-password" class="input-botanical" placeholder="Repeat new password" minlength="6" required>
          </div>
        </div>

        <button type="submit" class="btn-signin-submit">
          <span>Update Password & Sign In</span>
          <span>→</span>
        </button>
      </form>

      <div class="signin-register-prompt">
        <p>Remembered your password?</p>
        <div class="register-actions">
          <a href="signin.html" class="btn-register-link">Sign In</a>
        </div>
      </div>

    </div>

    <div class="signin-footer-note">
      © 2026 Vatika Botanical Sanctuary • Protected Educational Environment
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        AuthAPI.showAlert('auth-alert-box', 'Missing password reset token. Please request a new link from the Forgot Password page.', 'error');
        document.getElementById('new-password-form').style.display = 'none';
        return;
      }

      const form = document.getElementById('new-password-form');
      form.onsubmit = async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('new-password').value;
        const p2 = document.getElementById('confirm-password').value;

        if (p1 !== p2) {
          AuthAPI.showAlert('auth-alert-box', 'Passwords do not match. Please try again.', 'error');
          return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span>Updating Password...</span>';

        const res = await AuthAPI.resetPassword(token, p1);

        if (res.success) {
          AuthAPI.showAlert('auth-alert-box', 'Password updated successfully! Redirecting to Sign In...', 'success');
          form.style.display = 'none';
          setTimeout(() => { window.location.href = 'signin.html'; }, 1500);
        } else {
          AuthAPI.showAlert('auth-alert-box', res.error, 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Update Password & Sign In</span> <span>→</span>';
        }
      };
    });
  </script>
</body>
</html>
